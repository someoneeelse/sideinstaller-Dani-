name: Build SideInstaller IPA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/side-by-side-ios27
    paths:
      - "ios-app/**"
      - "rust-core/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --find clang

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Build Rust FFI
        run: |
          chmod +x build-rust.sh
          ./build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project SideInstaller.xcodeproj \
            -scheme SideInstaller \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/SideInstaller.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SideInstaller-Dani-iOS27-fix-unsigned.ipa Payload
          shasum -a 256 SideInstaller-Dani-iOS27-fix-unsigned.ipa > SHA256.txt
          ls -lh SideInstaller-Dani-iOS27-fix-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Dani-iOS27-fix
          path: |
            SideInstaller-Dani-iOS27-fix-unsigned.ipa
            SHA256.txt
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14
