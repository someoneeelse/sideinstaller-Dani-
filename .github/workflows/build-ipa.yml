name: Build SideInstaller IPA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/side-by-side-ios27
    paths:
      - "ios-app/**"
      - "rust-core/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Xcode environment
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find clang

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Apply iOS 27 Side by Side automation patch
        run: python3 scripts/patch-side-by-side-ios27.py

      - name: Build Rust FFI
        run: |
          chmod +x build-rust.sh
          ./build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project SideInstaller.xcodeproj \
            -scheme SideInstaller \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/SideInstaller.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SideInstaller.ipa Payload
          shasum -a 256 SideInstaller.ipa > SHA256.txt
          ls -lh SideInstaller.ipa

      - name: Publish rolling iOS 27 beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ios27-beta >/dev/null 2>&1; then
            gh release upload ios27-beta SideInstaller.ipa --clobber
          else
            gh release create ios27-beta SideInstaller.ipa --title "SideInstaller iOS 27 beta" --prerelease --notes "Automated iOS 27 Side by Side test build."
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Dani-iOS27-fix
          path: |
            SideInstaller.ipa
            SHA256.txt
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14
